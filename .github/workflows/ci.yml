name: CI

# Quality gate (spec §15 / docs/06.3). Runs with no cloud credentials, so it works on every
# PR and fork. Credentialed infra planning lives in infra-plan.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migration pairing check
        run: npm run check:migrations

      - name: Unit + integration tests
        run: npm test

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  infra:
    name: Infra — terraform fmt + validate (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate (dev)
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
